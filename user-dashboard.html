<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User & Vendor Dashboard — RoamBite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dash-body" data-page="user-dashboard">
  <div class="dash-layout" id="userAppShell">
    <div class="dash-backdrop" id="dashBackdrop"></div>

    <aside class="dash-sidebar" id="dashSidebar">
      <div>
        <div class="dash-brand-row">
          <a href="index.html" class="brand-logo">
            <div class="brand-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
            </div>
            <span>Roam<em>Bite</em></span>
          </a>
        </div>

        <div class="dash-role-pill" id="userRoleBadge">Dashboard</div>

        <nav class="dash-nav" id="userNav"></nav>
      </div>

      <div class="dash-sidebar-footer">
        <button type="button" class="dash-nav-btn" id="switchRoleViewBtn" style="background:rgba(255,255,255,0.12); color:#fff;">Switch to Customer View</button>
        <a href="index.html" class="dash-nav-btn">← Back to Main Site</a>
        <button type="button" class="dash-nav-btn" id="userLogoutBtn" style="color:#FFB694;">Sign Out</button>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <div class="dash-topbar-left">
          <button type="button" class="header-icon-btn dash-mobile-btn" id="dashMenuToggle" aria-label="Open Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="dash-search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="userGlobalSearch" placeholder="Search bookings, trucks, menu items...">
          </div>
        </div>

        <div class="dash-topbar-right">
          <button type="button" class="header-icon-btn" id="dashRtlToggle" title="Toggle RTL / LTR">RTL</button>
          <button type="button" class="header-icon-btn" id="dashThemeToggle" title="Toggle Theme">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>

          <div class="dash-dropdown-wrap" id="userNotifWrap">
            <button type="button" class="header-icon-btn" id="userNotifBtn" aria-label="Notifications">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="notif-badge-dot" id="userNotifDot"></span>
            </button>
            <div class="dash-dropdown-menu" id="userNotifMenu"></div>
          </div>

          <div class="dash-dropdown-wrap" id="userProfileWrap">
            <button type="button" class="header-icon-btn" id="userProfileBtn" aria-label="Account Menu">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </button>
            <div class="dash-dropdown-menu">
              <div style="padding:8px 10px; border-bottom:1px solid var(--cream-border); margin-bottom:6px;">
                <strong id="userProfileName" style="display:block; color:var(--purple-deep);">User</strong>
                <span id="userProfileEmail" style="font-size:0.8rem; color:var(--text-muted);">user@roambite.com</span>
              </div>
              <a href="auth.html" class="dash-nav-btn" style="color:var(--text-main); padding:8px 10px;">Switch Account</a>
              <a href="directory.html" class="dash-nav-btn" style="color:var(--text-main); padding:8px 10px;">Browse Directory</a>
              <button type="button" class="dash-nav-btn" id="userMenuLogout" style="color:var(--danger); padding:8px 10px;">Sign Out</button>
            </div>
          </div>
        </div>
      </header>

      <main class="dash-content" id="userMainView"></main>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/data.js"></script>
  <script src="js/app-state.js"></script>
  <script src="js/user-dashboard.js"></script>
</body>
</html>
